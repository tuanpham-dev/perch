# The Perch desktop app (desktop/). Modeled on tuanpham-dev/openray's
# build.yml, whose notes below come from real runs.
#
# - check: on every push and PR that touches the app or what it bundles,
#   Rust tests on Linux and a compile check on macOS and Windows - the
#   target_os-gated code there can't be checked on a Linux machine (the
#   -sys crates need each platform's own C compiler).
# - build: every platform's packages, only on a vX.Y.Z release tag (attached
#   to a draft GitHub Release "Perch X.Y.Z" whose notes are that version's
#   CHANGELOG.md entry; a -rc/-beta tag makes a pre-release) or a manual run
#   (uploaded as the run's artifacts) - never on an ordinary push. Each
#   platform builds on its own runner, so the bundled server's native module
#   (node-pty) is compiled for exactly the Node it ships with. Both also
#   sign the app's update files with the update key (repository secrets;
#   docs/DEVELOPMENT.md), and a release gets the latest.json the installed
#   apps check (plans/app-versioning.md R21).
name: Desktop app

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "desktop/**"
      - "server/**"
      - "mux/**"
      - "client/**"
      - "extensions/**"
      - "cli/tunnel.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "server/**"
      - "mux/**"
      - "client/**"
      - "extensions/**"
      - "cli/tunnel.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macos
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev patchelf build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: check-${{ matrix.target }}

      # generate_context!() embeds the launcher, and Tauri's build script
      # wants every `resources` path to exist - a placeholder stands in for
      # the staged server, which only the package build needs.
      - name: Launcher + resource placeholder
        shell: bash
        run: |
          npm ci --prefix desktop
          npm run build:launcher --prefix desktop
          mkdir -p desktop/src-tauri/resources/perch
          touch desktop/src-tauri/resources/perch/.keep

      - name: Rust tests
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Compile check
        working-directory: desktop/src-tauri
        run: cargo check --release --target ${{ matrix.target }}

  build:
    name: Build (${{ matrix.name }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
          - name: linux-arm64
            runner: ubuntu-22.04-arm
          - name: macos-arm64
            runner: macos-latest
          - name: macos-x64
            runner: macos-15-intel
          - name: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # xdg-utils: on the x86_64 Ubuntu image but not the -arm one, and the
      # AppImage bundler fails with "xdg-open binary not found" without it
      # (openray's note).
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libgtk-3-dev patchelf build-essential xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: build-${{ matrix.name }}

      - name: Install
        run: |
          npm ci
          npm ci --prefix desktop

      # Builds the web app and extensions, then stages Node + the server
      # into desktop/src-tauri/resources/perch.
      - name: Stage the bundled server
        run: npm run stage --prefix desktop

      # The release's notes: this version's CHANGELOG.md entry (written by
      # `npm run release`). A tag without one fails here, before building.
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "body<<PERCH_NOTES_EOF"
            node scripts/changelog-entry.mjs "$GITHUB_REF_NAME"
            echo "PERCH_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Two steps rather than one with ternary'd inputs: tauri-action treats
      # a present-but-empty tagName differently from an omitted one (only
      # omitting it skips creating a release) - openray's note.
      # createUpdaterArtifacts is set here, not in tauri.conf.json: it needs
      # the signing key, which a local `npm run build` doesn't have.
      - name: Build and publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'
          tagName: ${{ github.ref_name }}
          releaseName: Perch ${{ steps.notes.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Build only (manual run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Upload packages
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v7
        with:
          name: perch-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
